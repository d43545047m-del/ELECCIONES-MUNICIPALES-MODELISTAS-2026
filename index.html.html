<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elecciones Municipales Modelo 2026 🗳️</title>
    <link rel="icon" href="logo.png" type="image/png"> 
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.min.css">
    
    <style>
        :root {
            --celeste: #6EC1E4;
            --azul-oscuro: #1e3c72;
            --azul-borde: #00AEEF;
            --rojo: #E53935;
            --blanco: #FFFFFF;
            --negro: #000000;
            --gris: #555;
            --gris-claro: #f0f2f5; 
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 40px;
            --font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        body { 
            font-family: var(--font-family); 
            background: linear-gradient(135deg, #e0f2f7 0%, #d8e5ed 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: var(--gris);
            padding: var(--spacing-md); 
            box-sizing: border-box;
        }
        
        .container { 
            max-width: 1200px; 
            width: 95%; 
            background: var(--blanco); 
            padding: var(--spacing-xl) var(--spacing-lg); 
            border-radius: 25px; 
            box-shadow: 0 15px 60px rgba(0,0,0,0.1); 
            overflow: hidden; 
            box-sizing: border-box;
        }
        
        .logo {
            display: block;
            width: 120px; 
            height: auto;
            margin: 0 auto var(--spacing-xl) auto; 
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1)); 
        }

        h1 { 
            text-align: center; 
            color: var(--azul-oscuro); 
            margin-bottom: var(--spacing-xl); 
            font-size: 2.6em; 
            font-weight: 700;
            letter-spacing: -1px; 
            border-bottom: 4px solid var(--celeste); 
            padding-bottom: var(--spacing-md); 
            line-height: 1.2;
        }
        
        label[for="grado"] { 
            display: block; 
            font-weight: 600; 
            margin-bottom: var(--spacing-sm); 
            font-size: 1.1em; 
            color: var(--azul-oscuro); 
        }
        #grado { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: var(--spacing-xl); 
            border: 1px solid #cce; 
            border-radius: 12px; 
            background-color: var(--gris-claro); 
            box-sizing: border-box; 
            font-size: 1.05em; 
            color: var(--gris);
        }
        #grado:focus {
            border-color: var(--azul-borde);
            outline: none;
            box-shadow: 0 0 0 5px rgba(0, 174, 239, 0.25); 
        }

        h3 {
            color: var(--azul-oscuro); 
            margin-top: var(--spacing-lg);
            margin-bottom: var(--spacing-xl); 
            text-align: center;
            font-size: 1.5em; 
            font-weight: 700;
            text-transform: uppercase; 
            letter-spacing: 0.8px;
        }
        .swiper-container { 
            width: 100%; 
            padding-bottom: var(--spacing-md); 
        }
        .swiper-slide { 
            background: var(--blanco);
            border: 2px solid #e2e8f0; 
            border-radius: 18px; 
            transition: all 0.3s ease; 
            cursor: pointer;
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); 
        }
        .swiper-slide:hover {
            box-shadow: 0 18px 50px rgba(0, 174, 239, 0.28); 
            transform: translateY(-5px); 
        }

        .list-image-container {
            width: 100%;
            height: 320px; 
            overflow: hidden;
            position: relative;
            background-color: #f5f8fa; 
            display: flex; 
            justify-content: center;
            align-items: center;
        }
        .list-image-container img { 
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }
        
        .list-info {
            text-align: center;
            padding: var(--spacing-md);
            width: 100%;
            box-sizing: border-box;
            background-color: #fdfdfd; 
            border-top: 1px solid #eceff1; 
        }
        .list-info p.list-title { 
            margin: 0; 
            font-weight: 700; 
            color: var(--azul-oscuro); 
            font-size: 1.2em; 
        }
        .list-info small.list-slogan { 
            display: block;
            color: var(--gris);
            font-size: 0.9em; 
            margin-top: 4px;
        }
        
        .swiper-slide.selected { 
            border: 5px solid var(--azul-borde) !important; 
            box-shadow: 0 0 35px rgba(0, 174, 239, 0.8); 
            transform: scale(1.03); 
        }
        
        button { 
            padding: 18px 30px; 
            background-color: var(--azul-oscuro); 
            color: var(--blanco); 
            border-radius: 12px; 
            width: 100%; 
            font-size: 1.4em; 
            font-weight: 700; 
            box-shadow: 0 8px 0 var(--celeste); 
            margin-top: 25px; 
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #152c54;
        }

        @media (max-width: 768px) {
            .container { padding: var(--spacing-lg) var(--spacing-md); }
            h1 { font-size: 1.8em; }
            .list-image-container { height: 250px; } 
            button { font-size: 1.1em; padding: 15px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Logo Institucional" class="logo"> 
        
        <h1>Elecciones Municipales 2026</h1>
        
        <form id="formulario-voto">
            <label for="grado">Selecciona tu Grado:</label>
            <select id="grado" name="grado" required>
                <option value="">-- Selecciona un Grado --</option>
                <option value="Primero 1°">Primero 1°</option>
                <option value="Segundo 2°">Segundo 2°</option>
                <option value="Tercero 3°">Tercero 3°</option>
                <option value="Cuarto 4°">Cuarto 4°</option>
                <option value="Quinto 5°">Quinto 5°</option>
                <option value="Sexto 6°">Sexto 6°</option>
            </select>

            <h3>ELIGE TU LISTA:</h3>
            <div class="swiper-container">
                <div class="swiper-wrapper">
                    
                    <div class="swiper-slide" data-voto="Lista 1: Juventud Modelo Unida">
                        <div class="list-image-container">
                            <img src="Lista1.JPG" alt="Lista 1">
                        </div>
                        <div class="list-info">
                            <p class="list-title">Lista 1</p>
                            <small class="list-slogan">Juventud Modelo Unida</small>
                        </div>
                    </div>

                    <div class="swiper-slide" data-voto="Lista 2: Líderes en Acción">
                        <div class="list-image-container">
                            <img src="Lista2.JPG" alt="Lista 2">
                        </div>
                        <div class="list-info">
                            <p class="list-title">Lista 2</p>
                            <small class="list-slogan">Líderes en Acción</small>
                        </div>
                    </div>
                    
                    <div class="swiper-slide" data-voto="Lista 3: Alianza e Identidad Modelista">
                        <div class="list-image-container">
                            <img src="Lista3.JPG" alt="Lista 3">
                        </div>
                        <div class="list-info">
                            <p class="list-title">Lista 3</p>
                            <small class="list-slogan">Alianza e Identidad Modelista</small>
                        </div>
                    </div>

                    <div class="swiper-slide" data-voto="Lista 4: Todas las sangres una sola voz">
                        <div class="list-image-container">
                            <img src="Lista4.JPG" alt="Lista 4">
                        </div>
                        <div class="list-info">
                            <p class="list-title">Lista 4</p>
                            <small class="list-slogan">Todas las sangres una sola voz</small>
                        </div>
                    </div>

                </div>
            </div>
            
            <div class="swiper-pagination"></div> 
            
            <input type="hidden" id="voto-seleccionado" name="voto" required>

            <button type="submit" id="boton-votar">CONFIRMAR MI VOTO</button>
        </form>
    </div>

    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.all.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
